[package]
name = "nsh-connectivity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network status, change events, and real internet reachability."
repository.workspace = true
publish = false

[lib]
name = "nsh_connectivity"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
nsh-core = "0.4.0"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }

# The 204 reachability probe on native targets; the web uses the browser's fetch.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Apple: NWPathMonitor from Network.framework.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-network = "0.3"

# Android: ConnectivityManager over JNI. ndk-context carries the VM and the application context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Windows: Windows.Networking.Connectivity.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["std", "Foundation", "Networking_Connectivity"] }

# Linux: netdev for inspection, if-watch for events.
[target.'cfg(target_os = "linux")'.dependencies]
netdev = "0.47"
if-watch = { version = "3.2", default-features = false, features = ["tokio"] }

# Web: navigator.onLine, online/offline events, and the probe through fetch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Worker", "WorkerNavigator", "Request", "RequestInit", "AbortSignal", "Response", "Headers"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.2"
js-sys = "0.3"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
